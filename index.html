<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f5f0fa">
<title>젬 모자이크</title>
<style>
:root{
  --bg:#f5f0fa; --surface:#ffffff; --surface-2:#efe9f7; --text:#2a2140; --muted:#8a80a3;
  --accent:#7c4dff; --accent-2:#ff5ea8; --cell:#e4ddef; --num:#8d84a3; --board:#ffffff;
  --ring-bg:#e3dcef; --shadow:0 6px 24px rgba(60,30,120,.12); --danger:#ef4444;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15111f; --surface:#211b30; --surface-2:#2b2440; --text:#f1ecfb; --muted:#a69cc0;
    --accent:#a78bfa; --accent-2:#ff7ab8; --cell:#322a47; --num:#9a90b5; --board:#1c1729;
    --ring-bg:#3a3252; --shadow:0 6px 24px rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15111f; --surface:#211b30; --surface-2:#2b2440; --text:#f1ecfb; --muted:#a69cc0;
  --accent:#a78bfa; --accent-2:#ff7ab8; --cell:#322a47; --num:#9a90b5; --board:#1c1729;
  --ring-bg:#3a3252; --shadow:0 6px 24px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  overscroll-behavior:none}
body{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.active{display:flex}

/* ---------- Gallery ---------- */
#gallery{overflow-y:auto}
.g-head{padding:28px 16px 8px;max-width:980px;width:100%;margin:0 auto}
.logo{display:flex;align-items:center;gap:12px}
.logo h1{margin:0;font-size:28px;letter-spacing:-.02em}
.logo .mark{width:40px;height:40px}
.g-head p{margin:6px 0 0;color:var(--muted);font-size:15px}
.stats{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600}
.chip b{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;
  padding:16px;max-width:980px;width:100%;margin:0 auto 40px}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:12px;text-align:left;
  display:flex;flex-direction:column;gap:8px;transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.card:active{transform:scale(.97)}
.thumb{aspect-ratio:1;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.thumb canvas{max-width:86%;max-height:86%;image-rendering:pixelated}
.card .name{font-weight:700;font-size:15px}
.card .meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:3px}
.badge{position:absolute;top:8px;right:8px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
  font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}

/* ---------- Game ---------- */
.topbar{display:flex;align-items:center;gap:6px;padding:10px 10px 8px;padding-top:max(10px,env(safe-area-inset-top));background:var(--surface);box-shadow:var(--shadow);z-index:2}
.ibtn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.ibtn:hover{background:var(--surface-2)}
.ibtn.on{background:var(--accent);color:#fff}
.ibtn svg{width:22px;height:22px}
.titlebox{flex:1;min-width:0;padding:0 4px}
.titlebox .t{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titlebox .bar{margin-top:5px}
.titlebox .pct{font-size:11px;color:var(--muted);margin-top:3px}
.stage{flex:1;position:relative;min-height:0}
#board{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:crosshair}
#board.pan{cursor:grab}
.zoombox{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.zoombox .ibtn{background:var(--surface);box-shadow:var(--shadow)}
.palette{background:var(--surface);box-shadow:0 -6px 24px rgba(60,30,120,.08);padding:10px 8px;
  padding-bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;z-index:2}
.palette::-webkit-scrollbar{display:none}
.sw{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;width:56px;transition:transform .15s,opacity .2s}
.sw .ring{width:52px;height:52px;border-radius:50%;padding:4px;
  background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--ring-bg) 0)}
.sw .gem{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 34% 30%,var(--c2) 0 14%,var(--c) 52%,var(--c3) 100%);
  font-weight:800;font-size:17px;color:var(--tc);border:2px solid var(--surface)}
.sw .cnt{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.sw.sel{transform:translateY(-4px)}
.sw.sel .ring{background:conic-gradient(var(--accent-2) calc(var(--p)*1%),var(--accent) 0);box-shadow:0 4px 14px rgba(124,77,255,.45)}
.sw.done{opacity:.45}
.toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-20px);opacity:0;background:var(--surface);
  box-shadow:var(--shadow);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600;pointer-events:none;
  transition:opacity .25s,transform .25s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Complete overlay ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,10,40,.45);display:none;align-items:center;justify-content:center;z-index:10;padding:16px;backdrop-filter:blur(3px)}
.overlay.show{display:flex;animation:fade .3s}
.dialog{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:24px;width:min(360px,100%);text-align:center;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
.dialog h2{margin:4px 0 4px;font-size:26px}
.dialog p{margin:0 0 16px;color:var(--muted)}
.dialog .thumb{width:180px;margin:0 auto 18px}
.btns{display:flex;gap:10px}
.btn{flex:1;padding:13px;border-radius:14px;font-weight:700;background:var(--surface-2)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.8);opacity:0}}
</style>
</head>
<body>

</section>

<!-- Game -->

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V17h5v-1.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>
    </button>
    <button class="ibtn" id="panBtn" aria-label="이동 모드" title="이동 모드 (Space)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0M14 10V4a2 2 0 0 0-4 0v2M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-6-2.4l-3.6-3.6a2 2 0 0 1 2.8-2.8L7 15"/></svg>
    </button>
    <button class="ibtn" id="soundBtn" aria-label="소리">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z"/><path id="soundWave" d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/><path id="soundOff" d="M22 9l-6 6M16 9l6 6" style="display:none"/></svg>
    </button>
    <button class="ibtn" id="resetBtn" aria-label="처음부터">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
  </div>
  <div class="stage" id="stage">
    <canvas id="board"></canvas>
    <div class="zoombox">
      <button class="ibtn" id="zoomIn" aria-label="확대"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="ibtn" id="zoomOut" aria-label="축소"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
      <button class="ibtn" id="fitBtn" aria-label="전체 보기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
    <div class="toast" id="toast"></div>
  </div>
  <div class="palette" id="palette"></div>
</section>

<div class="overlay" id="confirmOverlay">
  <div class="dialog">
    <h2>처음부터 할까요?</h2>
    <p>이 그림에 붙인 보석이 모두 지워져요.</p>
    <div class="btns">
      <button class="btn" id="cancelReset">취소</button>
      <button class="btn primary" id="doReset">다시 시작</button>
    </div>
  </div>
</div>

<div class="overlay" id="doneOverlay">
  <div class="dialog">
    <div style="font-size:40px">💎</div>
    <h2>완성!</h2>
    <p id="doneName"></p>
    <div class="thumb" id="doneThumb"></div>
    <div class="btns">
      <button class="btn" id="toGallery">갤러리</button>
      <button class="btn primary" id="nextBtn">다음 그림</button>
    </div>
  </div>
</div>

    art:[

    palette:{ C:['#aee3ff','하늘'], W:['#ffffff','하양'], Y:['#ffd23f','해'], N:['#8a5a2b','나무'], R:['#ef4444','빨강'], H:['#1e3a8a','남색'], B:['#2b7de9','바다'], L:['#9fd3ff','물결'] },

    art(){
      const N = 27, c = 13, ch = 'ABCDEFG', rows = [];
      for (let y = 0; y < N; y++){
        let s = '';
        for (let x = 0; x < N; x++){
          const dx = x - c, dy = y - c, r = Math.hypot(dx, dy);
          if (r > 13.3){ s += '.'; continue; }
          const a = Math.atan2(dy, dx);
          const wave = Math.cos(a * 8) * 1.5 * Math.min(1, r / 4);
          const ring = Math.max(0, Math.floor((r + wave) / 2.2));
          s += ch[Math.min(ring, ch.length - 1)];
        }
        rows.push(s);
      }
      return rows;
    }},
];

/* ========================= 유틸 ========================= */
const $ = id => document.getElementById(id);
const hexToRgb = h => [1,3,5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (c, t, to) => c.map((v, i) => Math.round(v + (to[i] - v) * t));
const lighten = (c, t) => mix(c, t, [255,255,255]);
const darken  = (c, t) => mix(c, t, [0,0,0]);
const rgba = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const luma = c => (0.299*c[0] + 0.587*c[1] + 0.114*c[2]) / 255;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function buildLevel(def){
  const rows = typeof def.art === 'function' ? def.art() : def.art;
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const used = new Set(rows.join(''));
  const chars = Object.keys(def.palette).filter(k => used.has(k));
  const colors = chars.map(ch => {

function makeGem(rgb, s){

    const p = [];
    for (let k = 0; k < 8; k++){ const a = Math.PI/8 + k*Math.PI/4; p.push([cx + ox + Math.cos(a)*rad, cy + oy + Math.sin(a)*rad]); }
    return p;
  };
  const path = p => { g.beginPath(); p.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); };

  lg.addColorStop(0, rgba(lighten(rgb, .45))); lg.addColorStop(.5, rgba(rgb)); lg.addColorStop(1, rgba(darken(rgb, .38)));
  path(outer); g.fillStyle = lg; g.fill();

  for (let k = 0; k < 8; k++){
    const a = Math.PI/4 + k*Math.PI/4;           // 면의 중앙 방향
    const light = -(Math.cos(a) + Math.sin(a)) / Math.SQRT2; // 왼쪽 위에서 오는 빛
    path([outer[k], outer[(k+1)%8], inner[(k+1)%8], inner[k]]);
    g.fillStyle = light > 0 ? `rgba(255,255,255,${0.28*light})` : `rgba(0,0,0,${-0.22*light})`;
    g.fill();
  }
  // 테이블(가운데 면)
  const tg = g.createRadialGradient(cx - s*.08, cy - s*.1, 0, cx, cy, R*.6);
  tg.addColorStop(0, rgba(lighten(rgb, .55))); tg.addColorStop(1, rgba(lighten(rgb, .1)));
  path(inner); g.fillStyle = tg; g.fill();
  // 모서리 선

  for (let k = 0; k < 8; k++){ g.beginPath(); g.moveTo(...outer[k]); g.lineTo(...inner[k]); g.stroke(); }

  g.fillStyle = 'rgba(255,255,255,.7)';
  g.beginPath(); g.arc(cx + R*.28, cy + R*.3, R*.05, 0, Math.PI*2); g.fill();

}

    const i = y*L.w + x, v = L.grid[i]; if (v < 0) continue;
    const c = L.colors[v].rgb;

    else { const l = luma(c); const gr = dark ? Math.round(50 + l*50) : Math.round(205 + l*40); g.fillStyle = `rgb(${gr},${gr},${gr + 6})`; }

}

/* ========================= 게임 상태 ========================= */
const canvas = $('board'), ctx = canvas.getContext('2d');

let view = { s:20, ox:0, oy:0 };

function openLevel(id){

}

/* ---------- 팔레트 ---------- */

/* ---------- 화면/카메라 ---------- */
function resize(){

}
function fitScale(){ const L = G.L; return Math.min((cw - 32) / L.w, (ch - 32) / L.h); }
const minScale = () => fitScale() * 0.6;
const maxScale = () => Math.max(72, fitScale());
function fit(animate = true){

}

}

}

function cellAt(px, py){

/* ---------- 칠하기 ---------- */
function placeAt(i, isTap){

    if (isTap){ errs.set(i, performance.now()); if (navigator.vibrate) navigator.vibrate(30); draw(); }
    return false;
  }

  pops.set(i, performance.now());
  placeSound(G.combo++);
  if (hint && hint.i === i) hint = null;
  storeFilled(G.L, G.filled);
  updateProgress(); refreshPalette();
  if (G.left[v] === 0 && !G.left.every(n => n === 0)){ colorDoneSound(); toast(`${v+1}번 ${G.L.colors[v].name} 완료!`); }

function paintLine(a, b){

  let err = dx + dy;

  }

  const n = G.L.colors.length;
  for (let k = 1; k <= n; k++){ const j = (G.sel + k) % n; if (G.left[j] > 0){ select(j); return; } }
}

/* ---------- 힌트 ---------- */

  for (let i = 0; i < L.grid.length; i++){
    if (L.grid[i] !== G.sel || G.filled[i]) continue;

/* ---------- 완성 ---------- */

    const et = errs.get(i);

    }

  if (particles.length){
    anim = true;
    particles = particles.filter(p => p.life > 0 && p.y < ch + 60);
    for (const p of particles){
      p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= .008;
      ctx.save(); ctx.globalAlpha = Math.min(1, p.life*2); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.drawImage(fxGems[p.ci], -p.sz/2, -p.sz/2, p.sz, p.sz); ctx.restore();
    }
  }
  if (anim) draw();
}

/* ---------- 토스트 ---------- */
let toastTimer = 0;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}

/* ========================= 입력 ========================= */
const ptrs = new Map();
let mode = null;       // 'paint' | 'pan' | 'pinch' | 'idle'
let lastCell = -1, tapCell = -1, panLast = null, pinch = null;

function pos(e){ const r = canvas.getBoundingClientRect(); return { x:e.clientX - r.left, y:e.clientY - r.top }; }
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => {
  if (!G) return;
  canvas.setPointerCapture(e.pointerId);
  const p = pos(e); ptrs.set(e.pointerId, p);
  if (ptrs.size === 2){
    if (mode === 'paint') afterStroke();
    const [a, b] = [...ptrs.values()];
    pinch = { d:Math.hypot(a.x - b.x, a.y - b.y), mx:(a.x + b.x)/2, my:(a.y + b.y)/2 };
    mode = 'pinch'; return;
  }
  if (ptrs.size > 2) return;
  viewAnim = null;
  if (e.button === 1 || e.button === 2 || panMode || spaceDown || G.done){ mode = 'pan'; panLast = p; canvas.classList.add('pan'); return; }
  mode = 'paint'; G.combo = 0;
  lastCell = cellAt(p.x, p.y); tapCell = lastCell;
  if (lastCell >= 0 && placeAt(lastCell, false)) tapCell = -1;
});
canvas.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  const p = pos(e); ptrs.set(e.pointerId, p);
  if (mode === 'pinch' && ptrs.size === 2){
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x)/2, my = (a.y + b.y)/2;
    view.ox += mx - pinch.mx; view.oy += my - pinch.my;
    zoomAt(mx, my, d / pinch.d);
    pinch = { d, mx, my };
  } else if (mode === 'pan'){
    view = clampView({ s:view.s, ox:view.ox + p.x - panLast.x, oy:view.oy + p.y - panLast.y });
    panLast = p; draw();
  } else if (mode === 'paint'){
    const c = cellAt(p.x, p.y);
    if (c !== lastCell){
      tapCell = -1;
      if (c >= 0 && lastCell >= 0) paintLine(lastCell, c); else if (c >= 0) placeAt(c, false);
      lastCell = c;
    }
  }
});
function endPtr(e){
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (mode === 'paint'){
    if (tapCell >= 0) placeAt(tapCell, true);
    afterStroke();
  }
  if (ptrs.size === 0){ mode = null; canvas.classList.toggle('pan', panMode); }
  else if (mode === 'pinch') mode = 'idle';   // 손가락 하나 남으면 아무 동작도 하지 않음
}
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('wheel', e => {
  e.preventDefault(); if (!G) return;
  const p = pos(e);
  if (e.ctrlKey || Math.abs(e.deltaY) >= Math.abs(e.deltaX)) zoomAt(p.x, p.y, Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .0018)));
  else { view = clampView({ s:view.s, ox:view.ox - e.deltaX, oy:view.oy }); draw(); }
}, { passive:false });

window.addEventListener('keydown', e => {
  if (!G || !$('game').classList.contains('active')) return;
  if (e.code === 'Space'){ spaceDown = true; canvas.classList.add('pan'); e.preventDefault(); }
  else if (/^[1-9]$/.test(e.key) && +e.key <= G.L.colors.length) select(+e.key - 1);
  else if (e.key === 'h' || e.key === 'H') showHint();
  else if (e.key === 'f' || e.key === 'F') fit();
  else if (e.key === '+' || e.key === '=') zoomAt(cw/2, ch/2, 1.25);
  else if (e.key === '-') zoomAt(cw/2, ch/2, .8);
  else if (e.key === 'Escape') location.hash = '';
});
window.addEventListener('keyup', e => { if (e.code === 'Space'){ spaceDown = false; canvas.classList.toggle('pan', panMode); } });

/* ---------- 버튼 ---------- */
$('backBtn').onclick = () => { location.hash = ''; };
$('hintBtn').onclick = showHint;
$('fitBtn').onclick = () => fit();
$('zoomIn').onclick = () => zoomAt(cw/2, ch/2, 1.35);
$('zoomOut').onclick = () => zoomAt(cw/2, ch/2, 1/1.35);
$('panBtn').onclick = () => { panMode = !panMode; $('panBtn').classList.toggle('on', panMode); canvas.classList.toggle('pan', panMode); toast(panMode ? '이동 모드: 드래그로 그림을 움직여요' : '칠하기 모드'); };
function syncSound(){ $('soundWave').style.display = save.sound ? '' : 'none'; $('soundOff').style.display = save.sound ? 'none' : ''; }
$('soundBtn').onclick = () => { save.sound = !save.sound; persist(true); syncSound(); };
$('resetBtn').onclick = () => { if (G) $('confirmOverlay').classList.add('show'); };
$('cancelReset').onclick = () => $('confirmOverlay').classList.remove('show');
$('doReset').onclick = () => {
  $('confirmOverlay').classList.remove('show');
  if (!G) return;
  delete save.progress[G.L.id]; persist(true); openLevel(G.L.id);
};
$('toGallery').onclick = () => { $('doneOverlay').classList.remove('show'); location.hash = ''; };
$('nextBtn').onclick = () => {
  $('doneOverlay').classList.remove('show');
  const next = BUILT[(G.idx + 1) % BUILT.length];
  location.hash = 'play-' + next.id;
};

/* ---------- 라우팅 ---------- */
function route(){
  const m = location.hash.match(/^#play-([a-z0-9-]+)$/);
  if (m) openLevel(decodeURIComponent(m[1]));
  else { persist(true); G = null; $('doneOverlay').classList.remove('show'); showScreen('gallery'); renderGallery(); }
}
window.addEventListener('hashchange', route);
new ResizeObserver(() => { if (G && $('game').classList.contains('active')){ const was = view; resize(); view = clampView(was); draw(); } }).observe($('stage'));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readTheme(); if (G) draw(); else renderGallery(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) persist(true); });
syncSound();
route();
</script>
</body>
