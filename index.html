<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>젬 모자이크</title>
<style>
:root{
  --bg:#eef0fb; --text:#2a2140; --muted:#9aa0d6; --panel:#fbf3e6; --panel-edge:#eadcc4;
  --slot:#f1e6d3; --btn:#f7d9b9; --btn-edge:#d9a877; --go:#7ed957; --go-edge:#4fae3a;
  --card:#ffffff; --shadow:0 6px 20px rgba(60,40,120,.14);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17182b; --text:#eeeaf8; --muted:#8f95cc; --panel:#2a2539; --panel-edge:#3a3350;
    --slot:#352e47; --btn:#5a4632; --btn-edge:#3d2f22; --go:#5fbf43; --go-edge:#3a8a2a;
    --card:#241f33; --shadow:0 6px 20px rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17182b; --text:#eeeaf8; --muted:#8f95cc; --panel:#2a2539; --panel-edge:#3a3350;
  --slot:#352e47; --btn:#5a4632; --btn-edge:#3d2f22; --go:#5fbf43; --go-edge:#3a8a2a;
  --card:#241f33; --shadow:0 6px 20px rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overscroll-behavior:none;
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
body{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-bottom:max(8px,env(safe-area-inset-bottom))}
header{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;
  padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 4px max(14px,env(safe-area-inset-left))}
.gear{width:48px;height:48px;border-radius:14px;background:var(--btn);box-shadow:0 4px 0 var(--btn-edge);
  display:flex;align-items:center;justify-content:center}
.gear:active{transform:translateY(3px);box-shadow:0 1px 0 var(--btn-edge)}
.gear svg{width:26px;height:26px;color:#fff}
.lv{text-align:center}
.lv b{display:block;font-size:28px;font-weight:900;color:var(--muted);letter-spacing:-.01em}
.lv span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stage{flex:1;position:relative;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.toast{position:absolute;left:50%;top:8px;transform:translate(-50%,-14px);opacity:0;background:var(--card);
  box-shadow:var(--shadow);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:700;pointer-events:none;
  transition:opacity .25s,transform .25s;white-space:nowrap;z-index:3}
.toast.show{opacity:1;transform:translate(-50%,0)}
.overlay{position:fixed;inset:0;background:rgba(20,10,40,.45);display:none;align-items:center;justify-content:center;
  z-index:10;padding:16px;backdrop-filter:blur(3px)}
.overlay.show{display:flex;animation:fade .25s}
.dialog{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:22px;width:min(340px,100%);
  text-align:center;display:flex;flex-direction:column;gap:12px;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.dialog h2{margin:0;font-size:24px}
.dialog p{margin:0;color:var(--muted)}
.dialog canvas{align-self:center;max-width:200px;width:100%;border-radius:12px;image-rendering:pixelated}
.btn{padding:13px;border-radius:14px;font-weight:800;background:var(--slot)}
.btn.primary{background:var(--go);color:#fff;box-shadow:0 4px 0 var(--go-edge)}
.dialog.wide{width:min(560px,100%);max-height:86vh}
.lvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;overflow-y:auto;min-height:0;padding:4px}
.lvtile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:16px;background:var(--slot)}
.lvtile:active{transform:scale(.96)}
.lvtile.now{outline:3px solid var(--go)}
.lvtile canvas{width:64px;height:64px;object-fit:contain;image-rendering:pixelated;border-radius:6px}
.lvtile b{font-size:14px}
.lvtile span{font-size:11px;font-weight:700;color:var(--muted)}
.lvtile span.cur{color:var(--go-edge)}
.btn:focus-visible,.gear:focus-visible,.lvtile:focus-visible{outline:3px solid var(--muted);outline-offset:2px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.85);opacity:0}}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="gear" id="gearBtn" aria-label="설정">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
    <div class="lv"><b id="lvText">레벨 1</b><span id="pctText"></span></div>
    <button class="gear" id="levelsBtn" aria-label="레벨 선택">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>
    </button>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="toast" id="toast"></div>
  </div>
</div>

<div class="overlay" id="menu">
  <div class="dialog">
    <h2>설정</h2>
    <button class="btn" id="soundBtn">소리 켜짐</button>
    <button class="btn" id="menuLevels">레벨 선택</button>
    <button class="btn" id="restartBtn">이 레벨 다시 시작</button>
    <button class="btn primary" id="closeMenu">계속하기</button>
  </div>
</div>

<div class="overlay" id="levels">
  <div class="dialog wide">
    <h2>레벨 선택</h2>
    <p id="levelsInfo"></p>
    <div class="lvgrid" id="levelGrid"></div>
    <button class="btn primary" id="closeLevels">닫기</button>
  </div>
</div>

<div class="overlay" id="clear">
  <div class="dialog">
    <h2 id="clearTitle">레벨 클리어!</h2>
    <p id="clearName"></p>
    <canvas id="clearThumb"></canvas>
    <button class="btn primary" id="nextBtn">다음 레벨</button>
    <button class="btn" id="clearLevels">레벨 선택</button>
  </div>
</div>

<script>
"use strict";
/* =========================================================

const PICS = [

    palette:{ O:'#f59e42', D:'#a8561a', P:'#ff9fb8', K:'#2d2d3a', G:'#8ee05e', W:'#fff7ea' },
    art:[

  { name:'숲속 버섯', bg:'#bfe9ff', frame:'#ffd23f',
    palette:{ R:'#e53935', W:'#ffffff', C:'#e0b878', K:'#3b2a2a', G:'#2e9e4f', L:'#9be36b' },
    art:[
      '.....RRRRRR.....',

  { name:'딸기 컵케이크', bg:'#d9ccff', frame:'#ff8a3d',
    palette:{ R:'#e11d48', W:'#fff4e6', P:'#ff8fc0', Y:'#ffd23f', B:'#3b9dff', T:'#2bb5a6', D:'#136f66' },
    art:[

      '......WWWW......',

  { name:'바다 물고기', bg:'#3fa9f5', frame:'#ffd23f',
    palette:{ B:'#3fa9f5', L:'#d3f1ff', F:'#ff8c2b', S:'#fff7ea', T:'#e5334b', K:'#1f1f2e', G:'#2fbf71', A:'#e9c77b' },
    art:[

  { name:'바람 부는 돛단배', bg:'#aee3ff', frame:'#a0652e',
    palette:{ C:'#aee3ff', W:'#ffffff', Y:'#ffd23f', N:'#a0652e', R:'#ef4444', H:'#1e3a8a', B:'#2b7de9', L:'#40d0c0' },
    art:[

  { name:'구름 무지개', bg:'#cfeeff', frame:'#1e3a8a',
    palette:{ S:'#cfeeff', R:'#ef4444', O:'#fb923c', Y:'#facc15', G:'#22c55e', B:'#3b82f6', V:'#8b5cf6', W:'#ffffff' },
    art:[
      'SSSSSSSSSSSSSSSSSSSSSS',
      'SSSSSSSRRRRRRRRSSSSSSS',
      'SSSSSRROOOOOOOORRSSSSS',
      'SSSSROOYYYYYYYYOORSSSS',
      'SSSROYYGGGGGGGGYYORSSS',
      'SSROYGGBBBBBBBBGGYORSS',
      'SSROYGBBVVVVVVBBGYORSS',
      'SROYGBVVSSSSSSVVBGYORS',
      'SROYGBVSSSSSSSSVBGYORS',
      'ROYGBVSSSSSSSSSSVBGYOR',
      'RWWWBVSSSSSSSSSSVWWWOR',
      'WWWWWWSSSSSSSSSSWWWWWW',
      'SWWWWSSSSSSSSSSSSWWWWS',
      'SSSSSSSSSSSSSSSSSSSSSS' ]},
  { name:'보석 만다라', bg:'#fff1d6', frame:'#1b1f5e',
    palette:{ A:'#ffe066', B:'#ff8a3d', C:'#f0386b', D:'#a23bec', E:'#3a86ff', F:'#06c6a8', G:'#1b1f5e' },
    art(){
      const N = 25, c = 12, ch = 'ABCDEFG', rows = [];
      for (let y = 0; y < N; y++){
        let s = '';
        for (let x = 0; x < N; x++){
          const dx = x - c, dy = y - c, r = Math.hypot(dx, dy);
          if (r > 12.3){ s += '.'; continue; }
          const wave = Math.cos(Math.atan2(dy, dx) * 8) * 1.5 * Math.min(1, r / 4);
          s += ch[Math.min(Math.max(0, Math.floor((r + wave) / 2)), ch.length - 1)];
        }
        rows.push(s);
      }
      return rows;
    }},
];

/* ========================= 유틸 ========================= */
const $ = id => document.getElementById(id);
const hexToRgb = h => [1,3,5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (c, t, to) => c.map((v, i) => Math.round(v + (to[i] - v) * t));
const lighten = (c, t) => mix(c, t, [255,255,255]);
const darken  = (c, t) => mix(c, t, [0,0,0]);
const rgba = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function mulberry32(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function buildPic(def){
  const rows = typeof def.art === 'function' ? def.art() : def.art;
  const w = Math.max(...rows.map(r => r.length)) + 2, h = rows.length + 2;
  const colors = [], byHex = {};
  const add = hex => { hex = hex.toLowerCase(); if (!(hex in byHex)){ byHex[hex] = colors.length; const rgb = hexToRgb(hex);
    colors.push({ hex, rgb, cell:rgba(darken(rgb, .14)), socket:rgba(lighten(rgb, .28)), socketEdge:rgba(darken(rgb, .32), .55) }); }
    return byHex[hex]; };
  const target = new Int16Array(w*h), frame = new Uint8Array(w*h);
  const fi = add(def.frame);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    const i = y*w + x;
    if (x === 0 || y === 0 || x === w - 1 || y === h - 1){ target[i] = fi; frame[i] = 1; continue; }
    const ch = rows[y - 1][x - 1];
    target[i] = add((ch && def.palette[ch]) || def.bg);
  }
  return { name:def.name, w, h, colors, target, frame };
}
const BUILT = PICS.map(buildPic);
const nbrs = (P, i) => { const x = i % P.w, y = (i / P.w) | 0, r = [];
  if (x > 0) r.push(i - 1); if (x < P.w - 1) r.push(i + 1); if (y > 0) r.push(i - P.w); if (y < P.h - 1) r.push(i + P.w); return r; };

/* ---------- 레벨 섞기: 모든 칸이 배경색과 다른 보석으로 시작 ----------
   서로 다른 색 영역에서 같은 크기 덩어리를 골라 맞바꾸는 것을 칸이 남지 않을 때까지 반복합니다.
   맞바꾼 칸은 항상 배경색과 다르고, 색별 보석 개수는 그림과 정확히 같게 유지됩니다. */
function blobRange(lv){ return [3, Math.min(14, 6 + (lv >> 1))]; }
function scramble(P, lv){
  const rnd = mulberry32(lv * 7919 + 13);
  const [minB, maxB] = blobRange(lv);
  const N = P.w*P.h, T = P.target, gem = Int16Array.from(T), used = new Uint8Array(N);
  const grow = (start, size, color) => {
    const out = [start], seen = new Set(out);
    for (let k = 0; k < out.length && out.length < size; k++){
      const ns = nbrs(P, out[k]).sort(() => rnd() - .5);
      for (const j of ns){ if (out.length >= size) break;
        if (!seen.has(j) && !used[j] && T[j] === color){ seen.add(j); out.push(j); } }
    }
    return out;
  };
  const unused = () => { const r = []; for (let i = 0; i < N; i++) if (!used[i]) r.push(i); return r; };
  // 1) 덩어리 맞바꾸기
  for (let tries = 0; tries < 6000; tries++){
    const free = unused(); if (!free.length) break;
    const a = free[(rnd()*free.length) | 0], X = T[a];
    const others = free.filter(i => T[i] !== X); if (!others.length) break;
    const A = grow(a, minB + ((rnd()*(maxB - minB + 1)) | 0), X);
    const b = others[(rnd()*others.length) | 0], Y = T[b];
    const B = grow(b, A.length, Y);
    A.length = B.length;
    for (const c of A){ gem[c] = Y; used[c] = 1; }
    for (const c of B){ gem[c] = X; used[c] = 1; }
  }
  // 2) 아직 제자리인 칸은 가까운 칸과 바꿔서 어긋나게
  const dist = (i, j) => Math.abs(i % P.w - j % P.w) + Math.abs(((i / P.w) | 0) - ((j / P.w) | 0));
  for (let i = 0; i < N; i++){
    if (gem[i] !== T[i]) continue;
    let best = -1, bd = Infinity;
    for (let j = 0; j < N; j++){
      if (j === i || gem[j] === T[i] || gem[i] === T[j]) continue;
      const d = dist(i, j); if (d < bd){ bd = d; best = j; }
    }
    if (best >= 0){ const t = gem[i]; gem[i] = gem[best]; gem[best] = t; }
  }
  // 3) 대각선까지 이어진 같은 색 묶음이 너무 크면 잘라서 적당한 크기로
  const limit = maxB + 4;
  const n8 = i => { const x = i % P.w, y = (i / P.w) | 0, r = [];
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++){ if (!dx && !dy) continue;
      const nx = x + dx, ny = y + dy; if (nx >= 0 && ny >= 0 && nx < P.w && ny < P.h) r.push(ny*P.w + nx); }
    return r; };
  const groupOf = i => { const out = [i], seen = new Set(out);
    for (let k = 0; k < out.length; k++) for (const j of n8(out[k])) if (!seen.has(j) && gem[j] === gem[i]){ seen.add(j); out.push(j); }
    return out; };
  const fits = (cell, color, other) => n8(cell).every(k => k === other || gem[k] !== color);
  for (let round = 0; round < 400; round++){
    let big = null;
    const seen = new Uint8Array(N);
    for (let i = 0; i < N && !big; i++){ if (seen[i]) continue; const g = groupOf(i); g.forEach(k => seen[k] = 1); if (g.length > limit) big = g; }
    if (!big) break;
    // 묶음 일부(limit칸)만 남기고, 남길 부분과 맞닿은 칸을 다른 곳의 보석과 바꿔서 끊는다
    const inBig = new Set(big), keep = new Set([big[0]]), order = [big[0]];

    for (const i of cut){
      const c = gem[i]; let pick = -1, loose = -1;
      for (let t = 0; t < N; t++){

        if (inBig.has(j) || d === c || d === T[i] || c === T[j]) continue;
        if (loose < 0) loose = j;
        if (fits(i, d, j) && fits(j, c, i)){ pick = j; break; }
      }
      if (pick < 0) pick = loose;
      if (pick >= 0){ gem[i] = gem[pick]; gem[pick] = c; }
    }

}

/* ========================= 저장 ========================= */
const SAVE_KEY = 'gem-mosaic-sort-v1';
// level: 지금까지 열린 가장 높은 레벨, last: 마지막으로 하던 레벨, states: 레벨별 진행 중인 판
let save = { level:1, last:1, sound:true, states:{} };
try {
  const s = JSON.parse(localStorage.getItem(SAVE_KEY));
  if (s && s.level){
    save = Object.assign(save, s);
    if (s.state){ save.states[s.state.lv] = s.state; delete save.state; }   // 이전 저장 형식
    save.states = save.states || {};
    save.last = clamp(save.last || save.level, 1, save.level);
  }
} catch (e) {}
let saveTimer = 0;
function persist(now){
  clearTimeout(saveTimer);
  const run = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} };
  if (now) run(); else saveTimer = setTimeout(run, 300);
}
function snapshot(){
  if (!G || G.done) return;
  save.states[G.lv] = { lv:G.lv, gem:Array.from(G.gem), box:G.box.map(b => b.c), cap:G.cap, doneColors:[...G.doneColors] };
  // 현재 도전 중인 최고 레벨과 지금 하는 레벨의 판만 보관
  for (const k of Object.keys(save.states)) if (+k !== save.level && +k !== G.lv) delete save.states[k];
  save.last = G.lv;

/* ========================= 소리 ========================= */
let actx = null, lastTone = 0;
function tone(freq, dur = .08, vol = .06, type = 'triangle', when = 0, slide = 1.25){
  if (!save.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq*slide, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + .02);
  } catch (e) {}
}
const sfx = {
  lift(n){ for (let k = 0; k < Math.min(n, 6); k++) tone(880 - k*60, .06, .045, 'triangle', k*.03, .8); },
  drop(n){ for (let k = 0; k < Math.min(n, 6); k++) tone(523*Math.pow(2, [0,4,7,12,16,19][k]/12), .08, .05, 'triangle', k*.035); },
  pick(){ tone(740, .05, .04, 'sine'); },
  bad(){ tone(180, .12, .06, 'square', 0, .7); },
  win(){ [0,4,7,12,16,19,24].forEach((n, i) => tone(523*Math.pow(2, n/12), .25, .06, 'sine', i*.08)); },
};

/* ========================= 보석 스프라이트 ========================= */
function makeGem(rgb, s){
  const cv = document.createElement('canvas'); cv.width = cv.height = s;
  const g = cv.getContext('2d');
  const cx = s/2, cy = s/2, R = s*0.46 / Math.cos(Math.PI/8);
  const oct = (rad, ox = 0, oy = 0) => { const p = [];
    for (let k = 0; k < 8; k++){ const a = Math.PI/8 + k*Math.PI/4; p.push([cx + ox + Math.cos(a)*rad, cy + oy + Math.sin(a)*rad]); }
    return p; };
  const path = p => { g.beginPath(); p.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); };
  path(oct(R, 0, s*0.05)); g.fillStyle = rgba(darken(rgb, .55), .55); g.fill();             // 바닥 그림자
  const outer = oct(R);
  path(outer); g.fillStyle = rgba(darken(rgb, .22)); g.fill();                                  // 베벨
  const inner = oct(R*0.66, 0, -s*0.02);
  for (let k = 0; k < 8; k++){
    const a = Math.PI/4 + k*Math.PI/4, light = -(Math.cos(a)*.5 + Math.sin(a)) / 1.12;
    path([outer[k], outer[(k + 1) % 8], inner[(k + 1) % 8], inner[k]]);
    g.fillStyle = light > 0 ? `rgba(255,255,255,${.35*light})` : `rgba(0,0,0,${-.18*light})`; g.fill();
  }
  const tg = g.createLinearGradient(0, cy - R, 0, cy + R);
  tg.addColorStop(0, rgba(lighten(rgb, .35))); tg.addColorStop(1, rgba(rgb));
  path(inner); g.fillStyle = tg; g.fill();                                                       // 윗면
  g.lineWidth = Math.max(.6, s*.025); g.strokeStyle = rgba(darken(rgb, .45), .6); path(outer); g.stroke();
  g.fillStyle = 'rgba(255,255,255,.75)';
  g.beginPath(); g.ellipse(cx - R*.28, cy - R*.34, R*.17, R*.08, -.5, 0, Math.PI*2); g.fill(); // 하이라이트
  return cv;
}
let spriteCache = { px:0, map:new Map() };
function sprite(ci, px){
  if (spriteCache.px !== px) spriteCache = { px, map:new Map() };
  let s = spriteCache.map.get(ci);
  if (!s){ s = makeGem(G.P.colors[ci].rgb, px); spriteCache.map.set(ci, s); }
  return s;
}

/* ========================= 게임 상태 ========================= */
const canvas = $('cv'), ctx = canvas.getContext('2d');
let cw = 0, ch = 0, dpr = 1, theme = {};
let G = null, nextId = 1;
const lay = { cs:20, bx:0, by:0, boxCell:28, px:0, py:0, pw:0, ph:0, pad:10 };
const BOX_COLS = 12, BASE_CAP = 48, MAX_CAP = 72, REWARD = 4;
const pos = new Map();         // 컨테이너 보석 id → 화면 위치
let flyers = [];               // 그림으로 날아가는 보석
const pops = new Map(), errs = new Map();
let particles = [], shineAt = 0, lastT = 0, rafId = 0, celebrated = false;

function readTheme(){
  const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
  theme = { panel:v('--panel'), edge:v('--panel-edge'), slot:v('--slot'), text:v('--text') };
}

function startLevel(lv, fresh){
  let gem, box = [], cap = BASE_CAP, doneColors = null;
  lv = clamp(lv | 0, 1, save.level);
  const P = BUILT[(lv - 1) % BUILT.length];
  const st = save.states[lv];
  if (fresh) delete save.states[lv];
  if (!fresh && st && st.lv === lv && st.gem && st.gem.length === P.w*P.h && !st.gem.every((v, i) => v === P.target[i])){
    gem = Int16Array.from(st.gem); box = st.box || []; cap = clamp(st.cap || BASE_CAP, BASE_CAP, MAX_CAP);
    doneColors = st.doneColors || null;

  // 처음부터 완성돼 있던 색(테두리 등)은 보상 대상에서 제외
  G.doneColors = new Set(doneColors || P.colors.map((_, c) => c).filter(c => colorComplete(c)));
  save.last = lv; pos.clear(); flyers = []; pops.clear(); errs.clear(); particles = []; shineAt = 0; celebrated = false;
  spriteCache = { px:0, map:new Map() };
  $('lvText').textContent = `레벨 ${lv}`;
  $('levels').classList.remove('show'); $('menu').classList.remove('show');
  $('clear').classList.remove('show');
  layout(); updatePct(); snapshot(); draw();
}

function updatePct(){
  let ok = 0, all = 0;
  for (let i = 0; i < G.gem.length; i++){ all++; if (G.gem[i] === G.P.target[i]) ok++; }
  $('pctText').textContent = `${G.P.name} · ${Math.floor(ok / all * 100)}%`;
}

/* ---------- 레이아웃 ---------- */
function layout(){
  const r = $('stage').getBoundingClientRect();
  dpr = Math.min(3, window.devicePixelRatio || 1);
  cw = r.width; ch = r.height;
  canvas.width = Math.round(cw*dpr); canvas.height = Math.round(ch*dpr);
  if (!G) return;
  const P = G.P, side = 12, pad = 10, rows = MAX_CAP / BOX_COLS;
  let boxCell = Math.min((cw - side*2 - pad*2) / BOX_COLS, 46);
  boxCell = Math.min(boxCell, (ch*0.36 - pad*2) / rows);
  const pw = boxCell*BOX_COLS + pad*2, ph = boxCell*Math.ceil(G.cap / BOX_COLS) + pad*2, maxPh = boxCell*rows + pad*2;
  const boardH = ch - maxPh - 30;
  const cs = Math.min((cw - side*2) / P.w, boardH / P.h, 40);
  Object.assign(lay, { cs, boxCell, pad, pw, ph,
    bx: (cw - cs*P.w) / 2, by: Math.max(6, (boardH - cs*P.h) / 2),
    px: (cw - pw) / 2, py: ch - maxPh - 8 });
  draw();
}
const cellCenter = i => [lay.bx + (i % G.P.w + .5)*lay.cs, lay.by + (((i / G.P.w) | 0) + .5)*lay.cs];
const slotCenter = k => [lay.px + lay.pad + (k % BOX_COLS + .5)*lay.boxCell, lay.py + lay.pad + (((k / BOX_COLS) | 0) + .5)*lay.boxCell];

/* ---------- 규칙 ---------- */
function misplaced(i){ return G.gem[i] >= 0 && G.gem[i] !== G.P.target[i] && !G.hidden[i]; }
// 묶음 판정: 상하좌우 + 대각선 한 칸까지 붙어 있으면 같은 묶음

  const x = i % P.w, y = (i / P.w) | 0, r = [];

    if (!dx && !dy) continue;
    const nx = x + dx, ny = y + dy;
    if (nx >= 0 && ny >= 0 && nx < P.w && ny < P.h) r.push(ny*P.w + nx);

}

  return out;
}
function insertBox(c){
  let at = -1;
  for (let k = G.box.length - 1; k >= 0; k--) if (G.box[k].c === c){ at = k + 1; break; }
  const item = { id:nextId++, c };
  if (at < 0) G.box.push(item); else G.box.splice(at, 0, item);
  return item;
}
// 1) 잘못 놓인 보석 → 컨테이너
function liftGroup(i){
  const c = G.gem[i], room = G.cap - G.box.length;
  if (room <= 0){ toast('컨테이너가 꽉 찼어요'); sfx.bad(); draw(); return; }
  const grp = groupFrom(i, j => misplaced(j) && G.gem[j] === c);
  const take = grp.slice(0, room), now = performance.now();
  take.forEach((j, k) => {
    G.gem[j] = -1;
    const item = insertBox(c), [x, y] = cellCenter(j);
    pos.set(item.id, { x, y, start: now + k*22, from: lay.cs*.9, d0: 0 });
  });
  if (take.length < grp.length) toast('컨테이너가 꽉 찼어요');
  sfx.lift(take.length); updatePct(); snapshot(); draw();
}
function colorComplete(c){
  const P = G.P;
  for (let i = 0; i < P.target.length; i++) if (P.target[i] === c && G.gem[i] !== c) return false;
  return true;
}
// 2-a) 컨테이너 보석 선택
function pickColor(c){
  G.sel = G.sel && G.sel.src === 'box' && G.sel.c === c ? null : { src:'box', c, t0:performance.now() }; sfx.pick(); draw();
}
// 2-b) 그림판 보석 묶음 선택 (그 색 빈칸이 있을 때)
function pickGroup(i){
  const c = G.gem[i];
  G.sel = { src:'board', c, t0:performance.now(), cells: groupFrom(i, j => misplaced(j) && G.gem[j] === c) };
  sfx.pick(); draw();
}
// 3) 선택한 보석 → 빈칸 영역 채우기
function fillAt(i){
  const c = G.sel.c, P = G.P;
  if (P.target[i] !== c){ errs.set(i, performance.now()); sfx.bad(); if (navigator.vibrate) navigator.vibrate(25); toast('이 빈칸은 다른 색 자리예요'); draw(); return; }
  const region = groupFrom(i, j => G.gem[j] === -1 && P.target[j] === c);
  const now = performance.now();
  let n;
  if (G.sel.src === 'box'){
    const have = G.box.filter(b => b.c === c); n = Math.min(region.length, have.length);
    for (let k = 0; k < n; k++){
      const item = have[k], cell = region[k], p = pos.get(item.id) || { x:slotCenter(0)[0], y:slotCenter(0)[1] };
      flyers.push({ c, x:p.x, y:p.y, cell, start: now + k*22, from: lay.boxCell*.9, d0: 0 });
      pos.delete(item.id);
      G.gem[cell] = c; G.hidden[cell] = 1;
    }
    const gone = new Set(have.slice(0, n).map(b => b.id));

  } else {
    const src = G.sel.cells.filter(j => misplaced(j) && G.gem[j] === c); n = Math.min(region.length, src.length);
    for (let k = 0; k < n; k++){

      setTimeout(() => toast(`한 색 완성! 컨테이너 +${REWARD}칸`), 350);

    }

    save.last = G.lv + 1; persist(true);
  }
  else snapshot();
  updatePct(); draw();
}

/* ---------- 입력 ---------- */
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => {
  if (!G || G.done) return;
  const r = canvas.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  const P = G.P;
  // 그림판
  const gx = Math.floor((x - lay.bx) / lay.cs), gy = Math.floor((y - lay.by) / lay.cs);
  if (gx >= 0 && gy >= 0 && gx < P.w && gy < P.h){
    const i = gy*P.w + gx;
    if (G.hidden[i]) return;
    if (misplaced(i)){
      const s = G.sel;
      if (s && s.src === 'board' && s.cells.includes(i)){ G.sel = null; draw(); }         // 같은 묶음 다시 탭 → 선택 해제
      else pickGroup(i);                                                                  // 묶음 선택
    } else if (G.gem[i] === -1){
      if (G.sel) fillAt(i);
      else {
        toast('옮길 보석을 먼저 고르세요');
      }
    } else { G.sel = null; pops.set(i, performance.now()); draw(); }
    return;
  }
  // 컨테이너: 그림판 묶음을 고른 상태에서 컨테이너를 탭하면 보관
  const inPanel = x >= lay.px && x <= lay.px + lay.pw && y >= lay.py && y <= lay.py + lay.ph;
  if (inPanel && G.sel && G.sel.src === 'board'){
    const s = G.sel; G.sel = null;
    const first = s.cells.find(j => misplaced(j) && G.gem[j] === s.c);
    if (first !== undefined) liftGroup(first);
    return;
  }
  const kx = Math.floor((x - lay.px - lay.pad) / lay.boxCell), ky = Math.floor((y - lay.py - lay.pad) / lay.boxCell);
  if (kx >= 0 && kx < BOX_COLS && ky >= 0){
    const k = ky*BOX_COLS + kx;
    if (k < G.box.length){ pickColor(G.box[k].c); return; }
  }
  if (G.sel){ G.sel = null; draw(); }
});

/* ---------- 렌더링 ---------- */
function draw(){ if (!rafId) rafId = requestAnimationFrame(render); }

function ease(p, tx, ty, dt, now){

  const f = 1 - Math.exp(-dt*14);
  p.x += (tx - p.x)*f; p.y += (ty - p.y)*f;
  if (Math.hypot(tx - p.x, ty - p.y) < .6){ p.x = tx; p.y = ty; return true; }
  return false;
}
function render(now){

  let anim = false;

  const px = clamp(Math.round(Math.max(cs, bc)*.92*dpr), 8, 160);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cw, ch);

  ctx.save(); ctx.shadowColor = 'rgba(40,20,90,.18)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 4;
  ctx.fillStyle = P.colors[P.target[0]].cell; ctx.fillRect(lay.bx, lay.by, cs*P.w, cs*P.h); ctx.restore();

      if (G.sel && G.sel.src === 'board' && G.gem[i] === G.sel.c && G.sel.cells.includes(i)){ raised.push(i); continue; }

    }

  for (const i of raised){
    const [cx, cy] = cellCenter(i), d = gsz*(1 + .14*popUp), lift = cs*.2*popUp;
    ctx.fillStyle = `rgba(0,0,0,${.28*Math.min(1, popUp)})`;
    ctx.beginPath(); ctx.ellipse(cx, cy + cs*.12, gsz*.42, gsz*.2, 0, 0, Math.PI*2); ctx.fill();

  for (const i of raised){
    const [cx, cy] = cellCenter(i), d = gsz*(1 + .14*popUp), lift = cs*.2*popUp;

      const bw = P.w*cs, bh = P.h*cs, span = bw + bh, p = -span*.3 + q*span*1.6;
      ctx.save(); ctx.beginPath(); ctx.rect(lay.bx, lay.by, bw, bh); ctx.clip();
      const gr = ctx.createLinearGradient(lay.bx + p - bh*.4, lay.by, lay.bx + p + bh*.4, lay.by + bh);
      gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(.5, 'rgba(255,255,255,.6)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = gr; ctx.fillRect(lay.bx, lay.by, bw, bh); ctx.restore();
    }
    anim = true;
  }

  // ----- 컨테이너 -----
  ctx.save(); ctx.shadowColor = 'rgba(60,40,20,.18)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 5;
  rr(lay.px, lay.py, lay.pw, lay.ph, 18); ctx.fillStyle = theme.panel; ctx.fill(); ctx.restore();
  rr(lay.px, lay.py, lay.pw, lay.ph, 18); ctx.lineWidth = 2; ctx.strokeStyle = theme.edge; ctx.stroke();
  const rw = G.reward && now - G.reward.t0 < 1400 ? (now - G.reward.t0) / 1400 : 0;
  if (rw) anim = true;
  for (let k = G.box.length; k < G.cap; k++){
    const [sx, sy] = slotCenter(k);
    rr(sx - bc*.38, sy - bc*.38, bc*.76, bc*.76, bc*.22);
    if (k >= G.cap) break;
    ctx.fillStyle = theme.slot; ctx.fill();
    if (rw && k >= G.cap - REWARD){ ctx.lineWidth = 2.5; ctx.strokeStyle = `rgba(126,217,87,${1 - rw})`; ctx.stroke(); }
  }
  const flying = [];
  G.box.forEach((b, k) => {
    const [tx, ty] = slotCenter(k);
    let p = pos.get(b.id);
    if (!p){ p = { x:tx, y:ty, start:0, from:bc*.9, d0:0 }; pos.set(b.id, p); }
    if (!ease(p, tx, ty, dt, now)) anim = true;
    const sel = G.sel && G.sel.src === 'box' && b.c === G.sel.c;
    const lift = sel ? bc*.2*popUp : 0;
    const prog = p.d0 ? 1 - clamp(Math.hypot(tx - p.x, ty - p.y) / p.d0, 0, 1) : 1;
    const size = (p.from + (bc*.9 - p.from)*prog) * (sel ? 1 + .14*popUp : 1);
    if (prog < 1) { flying.push([b.c, p.x, p.y, size]); return; }
    if (sel){
      ctx.fillStyle = `rgba(0,0,0,${.25*Math.min(1, popUp)})`;
      ctx.beginPath(); ctx.ellipse(p.x, p.y + bc*.14, bc*.4, bc*.18, 0, 0, Math.PI*2); ctx.fill();
    }
    ctx.drawImage(sprite(b.c, px), p.x - size/2, p.y - size/2 - lift, size, size);
  });
  // 그림으로 날아가는 보석
  flyers = flyers.filter(f => {
    const [tx, ty] = cellCenter(f.cell);
    const arrived = ease(f, tx, ty, dt, now);
    if (arrived){ G.hidden[f.cell] = 0; pops.set(f.cell, now); anim = true; return false; }
    anim = true;
    const prog = f.d0 ? 1 - clamp(Math.hypot(tx - f.x, ty - f.y) / f.d0, 0, 1) : 0;
    flying.push([f.c, f.x, f.y, f.from + (gsz - f.from)*prog]);
    return true;
  });
  for (const [c, x, y, s] of flying) ctx.drawImage(sprite(c, px), x - s/2, y - s/2, s, s);

  // 파티클
  if (particles.length){
    anim = true;
    particles = particles.filter(p => p.life > 0 && p.y < ch + 60);
    for (const p of particles){
      p.vy += .3; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= .009;
      ctx.save(); ctx.globalAlpha = Math.min(1, p.life*2); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.drawImage(sprite(p.c, px), -p.s/2, -p.s/2, p.s, p.s); ctx.restore();
    }
  }
  if (G.done && !celebrated && !flyers.length){ celebrated = true; celebrate(); anim = true; }
  if (anim) draw(); else lastT = 0;
}

/* ---------- 클리어 ---------- */
function celebrate(){
  sfx.win(); shineAt = performance.now() + 150;
  const P = G.P;
  for (let k = 0; k < 70; k++){
    const a = Math.random()*Math.PI*2, sp = 4 + Math.random()*9;
    particles.push({ x:lay.bx + P.w*lay.cs/2, y:lay.by + P.h*lay.cs/2, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 5,
      c:(Math.random()*P.colors.length) | 0, s:10 + Math.random()*16, r:Math.random()*6, vr:(Math.random() - .5)*.3, life:1 });
  }
  const lv = G.lv;
  setTimeout(() => {
    if (!G || G.lv !== lv) return;
    $('clearTitle').textContent = `레벨 ${lv} 클리어!`;
    $('clearName').textContent = `"${P.name}" 완성`;
    const tc = $('clearThumb'), s = Math.floor(200 / Math.max(P.w, P.h));
    tc.width = P.w*s; tc.height = P.h*s;
    const g = tc.getContext('2d');
    for (let i = 0; i < P.target.length; i++){ g.fillStyle = P.colors[P.target[i]].hex; g.fillRect((i % P.w)*s, ((i / P.w) | 0)*s, s, s); }
    $('clear').classList.add('show');
  }, 1500);
}

/* ---------- UI ---------- */
let toastTimer = 0;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1700); }
function syncSound(){ $('soundBtn').textContent = save.sound ? '소리 켜짐' : '소리 꺼짐'; }
$('gearBtn').onclick = () => { syncSound(); $('menu').classList.add('show'); };
$('closeMenu').onclick = () => $('menu').classList.remove('show');
$('soundBtn').onclick = () => { save.sound = !save.sound; persist(true); syncSound(); };
$('restartBtn').onclick = () => { $('menu').classList.remove('show'); startLevel(G.lv, true); };
$('nextBtn').onclick = () => startLevel(G.lv + 1, false);
$('clearLevels').onclick = () => { $('clear').classList.remove('show'); openLevels(); };
$('levelsBtn').onclick = () => openLevels();
$('menuLevels').onclick = () => { $('menu').classList.remove('show'); openLevels(); };
$('closeLevels').onclick = () => $('levels').classList.remove('show');

/* ---------- 레벨 선택 ---------- */
function picThumb(P, done){
  const s = Math.max(2, Math.floor(72 / Math.max(P.w, P.h)));
  const cv = document.createElement('canvas'); cv.width = P.w*s; cv.height = P.h*s;
  const g = cv.getContext('2d');
  for (let i = 0; i < P.target.length; i++){
    const c = P.colors[P.target[i]].rgb;
    if (done) g.fillStyle = rgba(c);
    else { const l = Math.round(150 + (0.299*c[0] + 0.587*c[1] + 0.114*c[2]) * .35); g.fillStyle = `rgb(${l},${l},${l + 8})`; }
    g.fillRect((i % P.w)*s, ((i / P.w) | 0)*s, s, s);
  }
  return cv;
}
function openLevels(){
  const grid = $('levelGrid'); grid.innerHTML = '';
  $('levelsInfo').textContent = `클리어 ${save.level - 1}개 · 지금 레벨 ${save.level}`;
  for (let n = save.level; n >= 1; n--){
    const cleared = n < save.level, P = BUILT[(n - 1) % BUILT.length];
    const b = document.createElement('button'); b.className = 'lvtile' + (G && G.lv === n ? ' now' : '');
    b.appendChild(picThumb(P, cleared));
    const tag = !cleared ? '도전 중' : save.states[n] ? '이어하기' : '클리어';
    b.insertAdjacentHTML('beforeend', `<b>레벨 ${n}</b><span class="${cleared ? 'ok' : 'cur'}">${tag}</span>`);
    b.setAttribute('aria-label', `레벨 ${n} ${tag}`);
    b.onclick = () => startLevel(n, false);
    grid.appendChild(b);
  }
  $('levels').classList.add('show');
}

new ResizeObserver(() => layout()).observe($('stage'));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readTheme(); draw(); });
document.addEventListener('visibilitychange', () => { if (document.hidden){ if (G && !G.done) snapshot(); persist(true); } });
window.addEventListener('pagehide', () => persist(true));
readTheme();
startLevel(save.last || save.level || 1, false);
</script>
</body>
